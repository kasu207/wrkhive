# Produktivbetrieb auf einem eigenen Server (z. B. Hetzner). Anleitung: deploy/README.md
#
#   ./deploy/deploy.sh
#
# PROXY=caddy (Standard): mitgelieferter Caddy auf Port 80/443 mit automatischem HTTPS.
# PROXY=external: ein vorhandener Reverse Proxy (z. B. Caddy/nginx auf dem Server)
#   leitet auf 127.0.0.1:${APP_PORT} weiter; der mitgelieferte Caddy startet nicht.

name: wrkhive-prod

services:
  wrkhive:
    build:
      context: .
      args:
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-node:22-bookworm}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    image: wrkhive:prod
    container_name: wrkhive-app
    # Nur lokal auf dem Server erreichbar (für einen vorhandenen Reverse Proxy),
    # nie direkt aus dem Internet.
    ports:
      - "127.0.0.1:${APP_PORT:-3200}:3000"
    env_file:
      - path: .env.production
        required: true
    environment:
      APP_URL: https://${DOMAIN:?DOMAIN in .env.production setzen}
      DATABASE_PATH: /data/wrkhive.db
      # Persönlicher Server: nur das erste Konto darf sich registrieren, keine Demo.
      SIGNUP_MODE: ${SIGNUP_MODE:-first}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
    volumes:
      - wrkhive-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    # Nur mit PROXY=caddy (deploy.sh aktiviert das Profil).
    profiles: ["caddy"]
    image: ${CADDY_IMAGE:-caddy:2}
    container_name: wrkhive-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env.production setzen}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      wrkhive:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  wrkhive-data:
  caddy-data:
  caddy-config:
